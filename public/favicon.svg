<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sepehrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#sepehrGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="14.5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Accounting Grid & Chart Elements -->
  <!-- Ascending growth bar 1 -->
  <rect x="14" y="36" width="6" height="14" rx="2" fill="#ffffff" fill-opacity="0.75" />
  <!-- Ascending growth bar 2 -->
  <rect x="23" y="28" width="6" height="22" rx="2" fill="#ffffff" fill-opacity="0.85" />
  <!-- Ascending growth bar 3 (Peak) -->
  <rect x="32" y="20" width="6" height="30" rx="2" fill="#ffffff" />
  
  <!-- Stylized Persian 'س' (Sepehr) Growth Swash -->
  <path d="M14 28 C 20 20, 28 14, 48 16" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  <!-- Trend arrow tip -->
  <polygon points="50,13 52,21 44,18" fill="#fbbf24" />

  <!-- Balance Scales / Diamond Symbol -->
  <circle cx="44" cy="34" r="5" fill="url(#goldGrad)" />
  <circle cx="44" cy="34" r="2.5" fill="#ffffff" />
</svg>